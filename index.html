<html lang="en">
<head>

<title>Najla Albeladi | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F1F;--card:#151A30;--gold:#F7D046;--muted:#9AA0B8;--border:#232845}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:'Inter',sans-serif}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
.container{max-width:1000px;margin:0 auto;padding:24px}
nav{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700}.logo span{color:var(--gold)}
.badge{border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:20px;font-size:10px}
.hero{padding:50px 0;display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:center}
@media(max-width:700px){.hero{grid-template-columns:1fr;text-align:center}}
.hero h1{font-size:52px;line-height:.9}.hero h1 span{color:var(--gold)}
.hero p{color:var(--muted);margin:16px 0}
.btn{padding:12px 24px;border-radius:30px;text-decoration:none;font-weight:700;font-size:14px;display:inline-block;margin:4px}
.btn-gold{background:var(--gold);color:#000}.btn-out{border:1px solid var(--border);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-top:20px}
.project{margin-top:30px;border-left:4px solid var(--gold);padding-left:16px}
a{color:var(--gold)}
</style>
</head>
<body>
